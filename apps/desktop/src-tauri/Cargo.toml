[package]
name = "partspilot"
version = "0.1.0"
description = "PartsPilot desktop app"
authors = ["PartsPilot"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "partspilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-deep-link = "2.6"
tauri-plugin-keyring = "0.1"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
