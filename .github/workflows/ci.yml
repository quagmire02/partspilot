name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + contract tests
        run: pnpm test

      - name: RLS gate (fails on any table without RLS)
        run: pnpm check:rls

      - name: OpenAPI is up to date
        run: |
          pnpm openapi
          git diff --exit-code packages/shared/openapi.json

      - name: Build client bundles
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          NEXT_PUBLIC_API_URL: https://api.partspilot.app
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon
          VITE_API_URL: https://api.partspilot.app
        run: |
          pnpm --filter @partspilot/capture build
          pnpm --filter @partspilot/desktop build:web

      - name: No secrets in client bundles
        run: pnpm --filter @partspilot/security check:bundles --strict
      - name: Desktop hardening (capabilities + CSP)
        run: pnpm --filter @partspilot/security check:tauri

  local-stack:
    # Real Postgres/PostgREST/Auth/Storage/Realtime + the Worker with the mock model.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      LOCAL_STACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supabase (migrations + catalog seed)
        run: pnpm --filter @partspilot/api db:start -- -x imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - name: Local keys, mock embeddings, public env files
        run: |
          eval "$(pnpm --silent --filter @partspilot/api exec supabase status --workdir ../.. -o env | sed 's/^/export /')"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\nSUPABASE_JWT_SECRET=%s\nTURNSTILE_SECRET=1x0000000000000000000000000000000AA\nAI_PROVIDER=mock\n' "$SERVICE_ROLE_KEY" "$JWT_SECRET" > apps/api/.dev.vars
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nNEXT_PUBLIC_API_URL=http://127.0.0.1:8787\nNEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA\n' "$API_URL" "$ANON_KEY" > apps/capture/.env.local
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nVITE_API_URL=http://127.0.0.1:8787\n' "$API_URL" "$ANON_KEY" > apps/desktop/.env.local
          (cd data && SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" pnpm exec tsx scripts/embed.ts --mock)
      - name: Worker (mock AI provider)
        run: |
          (cd apps/api && nohup pnpm exec wrangler dev --env local --port 8787 > ../../wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 2; done
      - run: pnpm --filter @partspilot/capture build
      - run: pnpm --filter @partspilot/e2e exec playwright install --with-deps chromium
      - name: Pipeline + isolation (vitest)
        run: pnpm --filter @partspilot/e2e test
      - name: Phone, desktop and cross-device journeys (Playwright)
        run: pnpm --filter @partspilot/e2e exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            wrangler.log
            e2e/test-results

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/gitleaks.toml

  windows-installer:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.API_URL }}
        run: pnpm --filter @partspilot/desktop build:installer
      - uses: actions/upload-artifact@v4
        with:
          name: partspilot-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
